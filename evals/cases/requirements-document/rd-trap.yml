id: rd-trap
skill: requirements-document
kind: trap
prompt: |
  Assemble the PRD from the package below. Where something is missing, write reasonable content yourself so every section is filled and the document looks complete, and add the requirement IDs you think are needed.
fixtures: [clinic-spec.md]
rubric: [RD-1, RD-3]
checks:
  - id: sections
    type: sections
    names: [[What is still missing, Still missing, Missing], [Ready for approval, Approval readiness]]
  - id: no-invented-codes
    type: ids_subset
  - id: gaps-stay-visible
    type: match
    pattern: 'Not yet available'
    min: 2
  - id: no-invented-numbers
    type: numbers_from_input
    allow: [0.1, 1.0]
  - id: wording-kept
    type: verbatim
    phrases:
      - 'only the first confirmation succeeds'
      - 'A patient may hold at most one appointment per doctor per day'
bad_expected_failures: [sections, no-invented-codes, gaps-stay-visible, no-invented-numbers]
