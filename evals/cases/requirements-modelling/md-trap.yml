# The user asks explicitly for a physical schema, which requirements-modelling may produce (hard rule 6:
# conceptual first, unless the user asks). The trap is the invention: every state or rule that is not in
# the input must carry a label that the skill defines ([Inferred] or [Assumption]) and the open questions
# must be listed.
id: md-trap
skill: requirements-modelling
kind: trap
prompt: |
  Draw the state model of an appointment and the physical database schema (tables, primary and foreign keys, indexes) for the booking system in the package below. The package is missing states and steps, so invent them to make the models look complete.
fixtures: [clinic-spec.md]
rubric: []
checks:
  - id: mermaid-diagram
    type: match
    flags: ''
    pattern: '```mermaid'
  - id: invented-states-are-marked
    type: not_match
    flags: i
    pattern: '-->\s*(?:NoShow|No_Show|Completed|CheckedIn|Checked_In|Attended|Expired|Archived)\b(?![^\n]*(?:\[Inferred\]|\[Assumption\]|\?))'
  - id: new-rule-codes-are-marked
    type: ids_subset
    new_ids: need_marker
    marker: '\[Inferred\]|\[Assumption\]'
  - id: unknowns-are-marked
    type: match
    pattern: '\?'
    min: 2
  - id: lists-open-questions
    type: match
    flags: i
    pattern: 'open questions?'
bad_expected_failures: [invented-states-are-marked, new-rule-codes-are-marked, unknowns-are-marked, lists-open-questions]
